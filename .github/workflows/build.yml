name: Build

# Läuft nur bei Code-Änderungen (nicht bei reinen Doku-Commits).
# GitHub-Runner (macOS): seit das Repo öffentlich ist, kostenlos (E72).
# Kein eigener Runner bei öffentlichem Repo – fremde Pull Requests könnten
# sonst Code auf dem Rechner ausführen.
# Bildschirmfotos nur, wenn die letzte Commit-Nachricht „[fotos]“ (alle) bzw.
# „[fotos: name name]“ (nur diese) enthält oder
# der Lauf manuell gestartet wird (spart Zeit).
# Fehler werden zusätzlich als Annotationen ausgegeben, damit sie in der
# Lauf-Übersicht stehen (auch ohne Log-Download lesbar).
on:
  push:
    branches: [main]
    paths:
      - "ELRD/**"
      - "ELRDKit/**"
      - "ELRD.xcodeproj/**"
      - "ELRDUITests/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      fotos:
        description: "Bildschirmfotos erstellen"
        type: boolean
        default: true
      uitests:
        description: "Oberflächentests ausführen"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DERIVED: ${{ github.workspace }}/../ELRD-DerivedData
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode-Version
        run: echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      # Sparsam (Jonas): Die App-Hülle (ELRD/, Projekt) nur bauen, wenn sie sich
      # geändert hat oder Fotos gewünscht sind. Der ganze Code in ELRDKit wird beim
      # Testen ohnehin für den Simulator gebaut.
      - name: Geänderte Bereiche
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "APP_CHANGED=true" >> "$GITHUB_ENV"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(ELRD/|ELRD\.xcodeproj/|ELRDUITests/|ELRDWidgets|\.github/workflows/)'; then
            echo "APP_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "APP_CHANGED=false" >> "$GITHUB_ENV"
            echo "::notice title=App-Build::übersprungen (App-Hülle unverändert)"
          fi

      - name: App bauen (iOS Simulator)
        if: env.APP_CHANGED == 'true'
        run: |
          xcodebuild \
            -project ELRD.xcodeproj \
            -scheme ELRD \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || true
          # Fehler zuerst (sonst verdrängen die vielen SDK-Warnungen sie aus der Liste).
          { grep -E "^/.*: error: " build.log | sort -u | head -25; grep -E "^/.*: warning: " build.log | grep -v "Sendable" | sort -u | head -15; } | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"; lineno="${rest%%:*}"
            if [[ "$line" == *": error: "* ]]; then lvl=error; else lvl=warning; fi
            echo "::$lvl file=${file#$GITHUB_WORKSPACE/},line=$lineno::${line##*: $lvl: }"
          done
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            # Alle Zeilen mit „error:“ (auch ohne Pfad am Anfang, z. B. Makro-Dateien), gekürzt.
            grep -E "error: " build.log | grep -v "^\s*/Applications" | cut -c1-400 | sort -u | head -20 | while IFS= read -r line; do
              echo "::error title=Compiler::$line"
            done
            # Compiler-Absturz: Hinweise aus dem Stack-Dump.
            grep -iE "stack dump|segmentation|assertion|LLVM ERROR|while (type-checking|evaluating|emitting|silgen)|in (file|function)|^[0-9]+\.\s+Program arguments" build.log | cut -c1-300 | head -15 | while IFS= read -r line; do
              echo "::error title=Absturz::$line"
            done
            grep -E "error:|failed|FAILED" build.log | grep -vE "^/" | sort -u | head -15 | while IFS= read -r line; do
              echo "::error title=Build::$line"
            done
            exit 1
          fi

      - name: Tests ELRDKit
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if "iPad" in d["name"]), ios[0] if ios else None)
          print(pick["udid"] + "|" + pick["name"] if pick else "")
          ')
          if [ -z "$DEVICE" ]; then echo "::error title=Tests::Kein iOS-Simulator gefunden"; exit 1; fi
          echo "::notice title=Simulator::${DEVICE#*|}"
          cd ELRDKit
          # Seit Schritt 90 hat das Package zwei Produkte: Tests laufen über das Sammelschema.
          xcodebuild \
            -scheme ELRDKit-Package \
            -destination "id=${DEVICE%%|*}" \
            test > ../test.log 2>&1 || true
          cd ..
          grep -E "^/.*: error: |✘|recorded an issue" test.log | sort -u | head -30 | while IFS= read -r line; do
            echo "::error title=Test::$line"
          done
          if ! grep -q "TEST SUCCEEDED" test.log; then
            grep -iE "error|fatal|crash|unable|not found|failed" test.log | grep -v "WARNING: Using the first" | sort -u | head -20 | while IFS= read -r line; do
              echo "::error title=Tests::$line"
            done
            # Letzte Zeilen für Abstürze ohne klare Fehlermeldung.
            grep -v '^\s*$' test.log | tail -25 | while IFS= read -r line; do
              echo "::warning title=Testprotokoll (Ende)::$line"
            done
            exit 1
          fi
          grep -E 'Test run with' test.log | sort -u | while IFS= read -r line; do
            echo "::notice title=Tests::$line"
          done

      # Oberflächentests (Schritt 65) nur mit „[uitests]“ in der Commit-Nachricht oder
      # manuell – sie brauchen einige Minuten (sparsam, Jonas).
      - name: Oberflächentests (iPad Simulator)
        if: success() && (contains(github.event.head_commit.message, '[uitests]') || (github.event_name == 'workflow_dispatch' && inputs.uitests))
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if "iPad Pro" in d["name"]), next((d for d in ios if "iPad" in d["name"]), None))
          print(pick["udid"] if pick else "")
          ')
          if [ -z "$DEVICE_ID" ]; then echo "::error title=Oberflächentests::Kein iPad-Simulator"; exit 1; fi
          xcodebuild \
            -project ELRD.xcodeproj \
            -scheme ELRD \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED" \
            -only-testing:ELRDUITests \
            CODE_SIGNING_ALLOWED=NO \
            test > uitest.log 2>&1 || true
          grep -E "error: |failed|XCTAssert" uitest.log | grep -v "^\s*/Applications" | sort -u | head -25 | while IFS= read -r line; do
            echo "::error title=Oberflächentest::$(echo "$line" | cut -c1-400)"
          done
          if ! grep -q "TEST SUCCEEDED" uitest.log; then
            grep -v '^\s*$' uitest.log | tail -25 | while IFS= read -r line; do
              echo "::warning title=Protokoll (Ende)::$line"
            done
            exit 1
          fi
          grep -E "Executed [0-9]+ tests?" uitest.log | tail -1 | while IFS= read -r line; do
            echo "::notice title=Oberflächentests::$line"
          done

      - name: Bildschirmfotos (iPad Simulator)
        if: success() && (contains(github.event.head_commit.message, '[fotos') || (github.event_name == 'workflow_dispatch' && inputs.fotos))
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # „[fotos: map journal]“ fotografiert nur diese Bildschirme (schneller), „[fotos]“ alle.
          ONLY=$(printf '%s' "$HEAD_MESSAGE" | sed -n 's/.*\[fotos: *\([A-Za-z ]*\)\].*/\1/p' | head -1)
          if [ -n "$ONLY" ]; then echo "::notice title=Bildschirmfotos::Nur $ONLY"; fi
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if "iPad Pro 13" in d["name"]), next((d for d in ios if "iPad" in d["name"]), None))
          print(pick["udid"] if pick else "")
          ')
          xcodebuild -project ELRD.xcodeproj -scheme ELRD -configuration Debug \
            -destination "id=$DEVICE_ID" -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build > shots-build.log 2>&1 || { tail -20 shots-build.log; exit 1; }
          APP="$DERIVED/Build/Products/Debug-iphonesimulator/ELRD.app"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP"
          rm -rf shots && mkdir -p shots
          shoot() { # Gerät, Präfix, Modi, Bildschirme
            local device=$1 prefix=$2 modes=$3 screens=$4
            for mode in $modes; do
              xcrun simctl ui "$device" appearance $mode
              for screen in $screens; do
                xcrun simctl terminate "$device" ELRD.App || true
                xcrun simctl launch "$device" ELRD.App --demo-screen $screen -AppleLanguages "(de)" -AppleLocale de_DE
                sleep 5
                # Karte: MapKit braucht beim ersten Start länger (sonst weißes Bild).
                case $screen in map*) sleep 8 ;; esac
                xcrun simctl io "$device" screenshot "shots/$prefix$screen-$mode.png"
              done
            done
          }
          shoot "$DEVICE_ID" "" "light dark" "${ONLY:-setup login missions newMission newExercise workspace missionDetails patients patientTiles patientDetail triageGuide injuries unitPicker sections addUnit addPlaceholder replacePlaceholder map mapCollapsed mapTopo mapObject mapDrawing journal journalEntry journalNew missionTimeline protocolLog messages report settings masterData onboarding situationReport checklist leadership hospitals transportBoard handover}"
          # Jedes Gerät nach seinen Fotos herunterfahren: mehrere laufende Simulatoren
          # bremsen den Runner so stark, dass der Lauf das Zeitlimit reißt.
          xcrun simctl shutdown "$DEVICE_ID" || true
          over_budget() { [ $SECONDS -gt 2100 ]; } # nach 35 min keine weiteren Geräte
          # iPhone (hochkant): kleinste Breite
          PHONE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]), next((d for d in ios if d["name"].startswith("iPhone")), None))
          print(pick["udid"] if pick else "")
          ')
          if [ -n "$PHONE_ID" ] && ! over_budget; then
            xcrun simctl boot "$PHONE_ID" || true
            xcrun simctl bootstatus "$PHONE_ID" -b
            xcrun simctl install "$PHONE_ID" "$APP"
            shoot "$PHONE_ID" "phone-" "light" "${ONLY:-login missions newMission newExercise workspace missionDetails patients patientDetail triageGuide injuries unitPicker sections addUnit map journal journalNew missionTimeline report settings onboarding situationReport transportBoard leadership}"
            xcrun simctl shutdown "$PHONE_ID" || true
          elif [ -n "$PHONE_ID" ]; then
            echo "::warning title=Bildschirmfotos::Zeitbudget erreicht, iPhone übersprungen"
          else
            echo "::warning title=Bildschirmfotos::Kein iPhone-Simulator gefunden"
          fi
          # iPad mini (hochkant): Leiste unten
          MINI_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if "iPad mini" in d["name"]), None)
          print(pick["udid"] if pick else "")
          ')
          if [ -n "$MINI_ID" ] && ! over_budget; then
            xcrun simctl boot "$MINI_ID" || true
            xcrun simctl bootstatus "$MINI_ID" -b
            xcrun simctl install "$MINI_ID" "$APP"
            shoot "$MINI_ID" "mini-" "dark" "${ONLY:-login missions workspace missionDetails patients patientTiles patientDetail triageGuide injuries unitPicker sections addUnit addPlaceholder replacePlaceholder map mapCollapsed mapTopo mapObject mapDrawing journal journalEntry journalNew missionTimeline protocolLog messages report settings masterData onboarding situationReport checklist leadership hospitals transportBoard handover}"
            xcrun simctl shutdown "$MINI_ID" || true
          elif [ -n "$MINI_ID" ]; then
            echo "::warning title=Bildschirmfotos::Zeitbudget erreicht, iPad mini übersprungen"
          else
            echo "::warning title=Bildschirmfotos::Kein iPad-mini-Simulator gefunden"
          fi
          cd shots
          git init -q -b ci-screenshots
          git config user.name "ELRD CI"
          git config user.email "ci@users.noreply.github.com"
          echo "Bildschirmfotos von ${GITHUB_SHA} (automatisch erzeugt)" > README.md
          git add -A
          git commit -q -m "Bildschirmfotos ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
          echo "::notice title=Bildschirmfotos::Branch ci-screenshots aktualisiert"

      - name: Simulatoren beenden
        if: always()
        run: xcrun simctl shutdown all || true

      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
