name: Build

# Läuft nur bei Code-Änderungen (nicht bei reinen Doku-Commits).
# GitHub-Runner (macOS): seit das Repo öffentlich ist, kostenlos (E72).
# Kein eigener Runner bei öffentlichem Repo – fremde Pull Requests könnten
# sonst Code auf dem Rechner ausführen.
# Bildschirmfotos nur, wenn die letzte Commit-Nachricht „[fotos]“ enthält oder
# der Lauf manuell gestartet wird (spart Zeit).
# Fehler werden zusätzlich als Annotationen ausgegeben, damit sie in der
# Lauf-Übersicht stehen (auch ohne Log-Download lesbar).
on:
  push:
    branches: [main]
    paths:
      - "ELRD/**"
      - "ELRDKit/**"
      - "ELRD.xcodeproj/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      fotos:
        description: "Bildschirmfotos erstellen"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED: ${{ github.workspace }}/../ELRD-DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      - name: App bauen (iOS Simulator)
        run: |
          xcodebuild \
            -project ELRD.xcodeproj \
            -scheme ELRD \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || true
          # Fehler zuerst (sonst verdrängen die vielen SDK-Warnungen sie aus der Liste).
          { grep -E "^/.*: error: " build.log | sort -u | head -25; grep -E "^/.*: warning: " build.log | grep -v "Sendable" | sort -u | head -15; } | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"; lineno="${rest%%:*}"
            if [[ "$line" == *": error: "* ]]; then lvl=error; else lvl=warning; fi
            echo "::$lvl file=${file#$GITHUB_WORKSPACE/},line=$lineno::${line##*: $lvl: }"
          done
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            # Alle Zeilen mit „error:“ (auch ohne Pfad am Anfang, z. B. Makro-Dateien), gekürzt.
            grep -E "error: " build.log | grep -v "^\s*/Applications" | cut -c1-400 | sort -u | head -20 | while IFS= read -r line; do
              echo "::error title=Compiler::$line"
            done
            # Compiler-Absturz: Hinweise aus dem Stack-Dump.
            grep -iE "stack dump|segmentation|assertion|LLVM ERROR|while (type-checking|evaluating|emitting|silgen)|in (file|function)|^[0-9]+\.\s+Program arguments" build.log | cut -c1-300 | head -15 | while IFS= read -r line; do
              echo "::error title=Absturz::$line"
            done
            grep -E "error:|failed|FAILED" build.log | grep -vE "^/" | sort -u | head -15 | while IFS= read -r line; do
              echo "::error title=Build::$line"
            done
            exit 1
          fi

      - name: Tests ELRDKit
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if "iPad" in d["name"]), ios[0] if ios else None)
          print(pick["udid"] + "|" + pick["name"] if pick else "")
          ')
          if [ -z "$DEVICE" ]; then echo "::error title=Tests::Kein iOS-Simulator gefunden"; exit 1; fi
          echo "::notice title=Simulator::${DEVICE#*|}"
          cd ELRDKit
          xcodebuild \
            -scheme ELRDKit \
            -destination "id=${DEVICE%%|*}" \
            test > ../test.log 2>&1 || true
          cd ..
          grep -E "^/.*: error: |✘|recorded an issue" test.log | sort -u | head -30 | while IFS= read -r line; do
            echo "::error title=Test::$line"
          done
          if ! grep -q "TEST SUCCEEDED" test.log; then
            grep -iE "error|fatal|crash|unable|not found|failed" test.log | grep -v "WARNING: Using the first" | sort -u | head -20 | while IFS= read -r line; do
              echo "::error title=Tests::$line"
            done
            # Letzte Zeilen für Abstürze ohne klare Fehlermeldung.
            grep -v '^\s*$' test.log | tail -25 | while IFS= read -r line; do
              echo "::warning title=Testprotokoll (Ende)::$line"
            done
            exit 1
          fi
          grep -E 'Test run with' test.log | sort -u | while IFS= read -r line; do
            echo "::notice title=Tests::$line"
          done

      - name: Bildschirmfotos (iPad Simulator)
        if: success() && (contains(github.event.head_commit.message, '[fotos]') || (github.event_name == 'workflow_dispatch' && inputs.fotos))
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if "iPad Pro 13" in d["name"]), next((d for d in ios if "iPad" in d["name"]), None))
          print(pick["udid"] if pick else "")
          ')
          xcodebuild -project ELRD.xcodeproj -scheme ELRD -configuration Debug \
            -destination "id=$DEVICE_ID" -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build > shots-build.log 2>&1 || { tail -20 shots-build.log; exit 1; }
          APP="$DERIVED/Build/Products/Debug-iphonesimulator/ELRD.app"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP"
          rm -rf shots && mkdir -p shots
          shoot() { # Gerät, Präfix, Modi, Bildschirme
            local device=$1 prefix=$2 modes=$3 screens=$4
            for mode in $modes; do
              xcrun simctl ui "$device" appearance $mode
              for screen in $screens; do
                xcrun simctl terminate "$device" ELRD.App || true
                xcrun simctl launch "$device" ELRD.App --demo-screen $screen -AppleLanguages "(de)" -AppleLocale de_DE
                sleep 5
                xcrun simctl io "$device" screenshot "shots/$prefix$screen-$mode.png"
              done
            done
          }
          shoot "$DEVICE_ID" "" "light dark" "setup login missions newMission workspace missionDetails patients patientTiles patientDetail injuries sections addUnit addPlaceholder replacePlaceholder map mapTopo mapObject mapDrawing"
          # iPad mini (hochkant): Leiste unten
          MINI_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, lst in devices.items() if "iOS" in runtime for d in lst]
          pick = next((d for d in ios if "iPad mini" in d["name"]), None)
          print(pick["udid"] if pick else "")
          ')
          if [ -n "$MINI_ID" ]; then
            xcrun simctl boot "$MINI_ID" || true
            xcrun simctl bootstatus "$MINI_ID" -b
            xcrun simctl install "$MINI_ID" "$APP"
            shoot "$MINI_ID" "mini-" "dark" "login missions workspace missionDetails patients patientTiles patientDetail injuries sections addUnit addPlaceholder replacePlaceholder map mapTopo mapObject"
          else
            echo "::warning title=Bildschirmfotos::Kein iPad-mini-Simulator gefunden"
          fi
          cd shots
          git init -q -b ci-screenshots
          git config user.name "ELRD CI"
          git config user.email "ci@users.noreply.github.com"
          echo "Bildschirmfotos von ${GITHUB_SHA} (automatisch erzeugt)" > README.md
          git add -A
          git commit -q -m "Bildschirmfotos ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
          echo "::notice title=Bildschirmfotos::Branch ci-screenshots aktualisiert"

      - name: Simulatoren beenden
        if: always()
        run: xcrun simctl shutdown all || true

      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
