# Mosquitto für den Betrieb: nur TLS (Port 8883), Anmeldung Pflicht.
# Zertifikate z. B. von Let's Encrypt nach /mosquitto/certs kopieren
# (fullchain.pem, privkey.pem) – siehe backend/README.md.
per_listener_settings false
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
# Interner Zugang für das Backend im selben Docker-Netz (nicht nach außen veröffentlicht).
listener 1883 0.0.0.0
